spring.application.name=inventory-backend
spring.profiles.default=dev

# Un solo DataSource: Flyway reutiliza esta conexion y estas credenciales.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate valida; Flyway es el unico mecanismo de migracion.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=dbo
spring.flyway.schemas=dbo
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

app.jwt.enabled=${JWT_ENABLED:false}
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=lm-medical-supplies
app.jwt.audience=lm-medical-api



server.port=8080
